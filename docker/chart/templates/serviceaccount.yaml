{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metaframework.serviceAccountName" . }}
  labels:
    {{- include "metaframework.portal.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The portal makes no Kubernetes API call — it reads a catalog off the
# filesystem and serves HTTP. Mounting a token would hand it a credential it has
# no use for.
automountServiceAccountToken: false
{{- end }}
