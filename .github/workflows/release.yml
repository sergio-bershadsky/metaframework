# Publishing, on a tag.
#
# `git push origin v0.4.0` is the whole trigger. Everything a release needs to be
# true is asserted here rather than remembered: that the tag names the version
# the tree declares, that the gates are green at that commit, that the tarball
# carries no sources, and that the published site and the published package
# describe the same ontology.
#
# THE FIRST JOB EXISTS BECAUSE THE OPPOSITE HAPPENED. v0.4.0 was first pushed at
# a commit whose package.json still said 0.3.0, because the version bump was
# uncommitted when the publish ran. npm was right and the repository's record of
# it was wrong, which is the worse way round: the tarball is immutable and the
# tag is what everyone reads afterwards.
#
# npm is published through TRUSTED PUBLISHING — OIDC, no token. The trusted
# publisher on npmjs.com must name this repository and this file by name:
# `release.yml`, case-sensitive. Renaming this file breaks publishing, and the
# error will be an authentication failure rather than a missing file.
#
# Cloudflare still needs a secret; it has no OIDC equivalent here.
#
# No step interpolates event-controlled text into a shell. The tag name reaches
# `run:` through the environment, never through `${{ }}` inside a command.
name: release

on:
  push:
    tags: ['v*']
  # The published site is a SNAPSHOT of the catalog, and catalog edits land
  # between releases — so it needs a way to be refreshed without inventing a
  # version to hang it on. A dispatch runs verify and the site; npm is skipped,
  # because republishing a version that already exists is not a thing npm
  # permits and not a thing anyone wants.
  workflow_dispatch:

# Least privilege at the top; the npm job widens it to `id-token: write` for
# itself alone, because that permission IS the npm credential under trusted
# publishing and no other job should be able to mint one.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: framework/portal/package-lock.json

      # `manifest-identity` already holds the five in-tree claims to each other.
      # What it cannot see is the tag, which lives outside the tree — so that
      # comparison is made here, and it is the one this job was added for.
      - name: the tag names the version the tree declares
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared=$(node -p "require('./framework/portal/package.json').version")
          expected="v$declared"
          if [ "$TAG" != "$expected" ]; then
            echo "tag $TAG points at a tree declaring $declared (expected $expected)" >&2
            echo "move the tag to the commit that bumps the version, or bump it here" >&2
            exit 1
          fi
          echo "$TAG == $expected"

      - name: repo hygiene
        run: node framework/portal/scripts/repo-hygiene.mjs

      - run: npm ci
        working-directory: framework/portal

      - run: npx next typegen
        working-directory: framework/portal

      - run: npm run typecheck
        working-directory: framework/portal

      - run: npx eslint src bin scripts
        working-directory: framework/portal

      - run: npm test
        working-directory: framework/portal

      - name: build and assemble the CLI package
        run: npm run package
        working-directory: framework/portal

      - name: metaframework check
        run: node framework/portal/bin/metaframework.mjs check

      # Same audit as ci.yml. A release is the one run where a leak actually
      # reaches users, so it is repeated rather than assumed from the push build.
      - name: pack audit
        working-directory: framework/portal
        run: |
          npm pack --dry-run --ignore-scripts --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map((f) => f.path)
            const leaks = files.filter((p) =>
              p.startsWith("src/") || p.includes(".test.") ||
              p.startsWith("solutions/") || p.startsWith("framework/spec/"))
            if (leaks.length) {
              console.error("tarball leaks:", leaks.join(", "))
              process.exit(1)
            }
            console.log(files.length, "files, no leaks")
          '

  npm:
    needs: verify
    # Tag pushes only. A manual dispatch is for redeploying the site.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # TRUSTED PUBLISHING. There is no npm token here and there is not meant to
    # be: the OIDC token GitHub mints for this job is the credential, and npm
    # trades it for a short-lived one after checking the claim against the
    # trusted publisher configured on npmjs.com. A leaked long-lived token is
    # the failure this removes rather than mitigates.
    #
    # `id-token: write` is scoped to this job. Granting it at the top of the
    # file would let the site job mint a publish credential it has no use for.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24, not the 22 the gates run on. Trusted publishing needs npm
      # >= 11.5.1 and Node >= 22.14.0, and Node 22 still ships npm 10.9.8 —
      # which fails by falling back to looking for a token that is not there,
      # so the error names authentication rather than the version. Node 24
      # bundles npm 11.19.0 and satisfies both bounds at once.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: framework/portal/package-lock.json
          registry-url: https://registry.npmjs.org

      # Assert the bound rather than trust the runner image, which moves.
      - name: npm is new enough for OIDC
        run: |
          v=$(npm -v)
          node -e '
            const [have] = process.argv.slice(1)
            const need = "11.5.1"
            const cmp = (a, b) => a.split(".").map(Number).reduce((r, n, i) => r || n - b.split(".").map(Number)[i], 0)
            if (cmp(have, need) < 0) {
              console.error(`npm ${have} cannot use trusted publishing; ${need} or newer is required`)
              process.exit(1)
            }
            console.log(`npm ${have} >= ${need}`)
          ' "$v"

      - run: npm ci
        working-directory: framework/portal

      # No NODE_AUTH_TOKEN, and no `--provenance`: under trusted publishing npm
      # generates and publishes provenance attestations by default, so passing
      # the flag would only restate what OIDC already guarantees.
      #
      # `npm publish` runs prepack, which checks the embedded meta-schemas are
      # fresh and then builds — so this one command is the full build, assemble
      # and pack, and it can fail before any of it starts.
      - name: publish to npm
        working-directory: framework/portal
        run: npm publish --access public

  site:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: framework/portal/package-lock.json

      - run: npm ci
        working-directory: framework/portal

      # publish.sh validates, builds, serves, crawls both sites and deploys. It
      # preflights the credential before spending the build, so a missing grant
      # fails in seconds rather than after a 490-page crawl.
      #
      # CLOUDFLARE_API_TOKEN needs exactly one grant: Account -> Workers Scripts
      # -> Edit. It needs nothing at zone level, because the two hostnames are
      # attached once as zone Workers routes (deploy/README.md) and a content
      # deploy never touches DNS.
      - name: publish the catalog and the schemas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy/publish.sh
