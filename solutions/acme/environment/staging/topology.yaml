regions:
  - name: eu-west-1
    zones: [a]
    notes: Single zone on purpose — staging rehearses protocol shape, not failure domains.

hosts:
  - component: /shop
    regions: [eu-west-1]
    replicas: { min: 1, max: 2 }
    notes: product-wide default for every component beneath shop
  - component: /shop/checkout
    regions: [eu-west-1]
    replicas: { min: 2, max: 2 }
    scaling: fixed — load tests need a stable denominator
  - component: /billing/reconciliation
    regions: [eu-west-1]
    replicas: { min: 1, max: 1 }
    scaling: scheduled; one instance by construction
