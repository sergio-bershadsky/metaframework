kind: http
summary: JSON over HTTPS, served by checkout at the storefront edge.
encoding: json
auth:
  - oauth2-bearer
http:
  base-path: /api/v1/orders
  tls: true
  operations:
    - name: create-order
      method: POST
      path: /
      request: /shop/datamodel/order-request@1
      response: /shop/datamodel/order-confirmation@1
      summary: Place an order. Requires an Idempotency-Key header.
    - name: get-order
      method: GET
      path: /{order-id}
      response: /shop/datamodel/order-confirmation@1
      summary: Read the current confirmation projection of one order.
    - name: cancel-order
      method: DELETE
      path: /{order-id}
      response: /datamodel/problem@1
      summary: Cancel before dispatch. Returns a problem document when the order has shipped.
