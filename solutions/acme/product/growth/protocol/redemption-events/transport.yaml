asyncapi: 3.1.0
x-srn: srn://acme/product/growth/protocol/redemption-events
info:
  title: Redemption events
  version: unversioned
  description: Redemption facts published by coupon-service and consumed by everything in growth that keeps a total.
defaultContentType: application/vnd.apache.avro
servers:
  acme-growth:
    host: "{host}"
    # The plain spelling, not `kafka-secure`. `protocol` is required, so one of
    # the two must be written; the mini-spec's `kafka` binding carries no `tls`
    # field at all — unlike `http`, `grpc` and `websocket`, which do — so the
    # file this replaces made no claim about the wire. The `auth` labels below
    # are the only security fact it ever stated, and they carry over verbatim.
    protocol: kafka
    variables:
      host:
        description: Supplied by the environment; this protocol names no deployment.
    x-srn-auth:
      - sasl-scram
      - mtls
channels:
  redemption-recorded:
    address: acme.growth.redemption-recorded.v1
    summary: Emitted inside the transaction that burnt the code, so a published fact is always durable.
    bindings:
      kafka:
        partitions: 6
        topicConfiguration:
          retention.ms: 7776000000    # was `retention: 90d`
        bindingVersion: "0.5.0"
    messages:
      redemption-recorded:
        x-srn-payload: /product/growth/datamodel/redemption@1
        x-srn-partition-key: campaign-id

  redemption-reversed:
    address: acme.growth.redemption-reversed.v1
    summary: The same record with reversed-at set. A correction is a new fact, never an edit of the first.
    bindings:
      kafka:
        partitions: 6
        topicConfiguration:
          retention.ms: 7776000000    # was `retention: 90d`
        bindingVersion: "0.5.0"
    messages:
      redemption-reversed:
        x-srn-payload: /product/growth/datamodel/redemption@1
        x-srn-partition-key: campaign-id

  campaign-state-changed:
    address: acme.growth.campaign-state-changed.v1
    summary: Published by campaign-manager when a budget is exhausted or a window closes; the engine's cache-invalidation signal.
    bindings:
      kafka:
        partitions: 6
        topicConfiguration:
          retention.ms: 7776000000    # was `retention: 90d`
        bindingVersion: "0.5.0"
    messages:
      campaign-state-changed:
        x-srn-payload: /product/growth/datamodel/campaign@1
        x-srn-partition-key: campaign-id

# No `operations` block. The mini-spec's kafka surface list records no direction,
# and `action` is send/receive relative to one application — inventing a side
# here would say more than the file it replaces. Who publishes and who consumes
# is in `participants` in index.md, where it always was.
