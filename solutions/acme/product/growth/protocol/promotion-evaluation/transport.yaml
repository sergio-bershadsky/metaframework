kind: http
summary: JSON over mTLS inside the cluster. Checkout is the only caller with a client certificate.
encoding: json
auth:
  - mtls
http:
  base-path: /api/v1/quotes
  tls: true
  operations:
    - name: evaluate-cart
      method: POST
      path: /
      request: /product/shop/component/checkout/datamodel/cart@1
      response: /product/growth/datamodel/promotion-quote@1
      summary: Price a cart against every promotion the account is eligible for. Always answers, possibly with fallback set.
    - name: add-coupon
      method: POST
      path: /{quote-id}/coupons
      request: /product/growth/datamodel/coupon@1
      response: /product/growth/datamodel/promotion-quote@1
      summary: Add a customer-entered code to an existing quote. Validates only; the code is not burnt here.
    - name: remove-coupon
      method: DELETE
      path: /{quote-id}/coupons/{code}
      response: /product/growth/datamodel/promotion-quote@1
      summary: Withdraw a code the customer entered and re-evaluate without it. Idempotent — removing a code that was never applied returns the quote unchanged.

    - name: get-quote
      method: GET
      path: /{quote-id}
      response: /product/growth/datamodel/promotion-quote@1
      summary: Re-read a quote before converting a cart. Returns a problem document once expires-at has passed.
