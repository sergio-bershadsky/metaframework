$schema: https://schemas.metaframework.dev/metaframework/product/specification/datamodel/transport-document
kind: in-process
summary: Direct function calls inside the checkout process — no network hop.
encoding: json
in-process:
  language: typescript
  module: "@acme/checkout-core/tax"
  interface: TaxCalculator
  functions:
    - name: quote
      request: /product/shop/component/checkout/datamodel/cart@1
      response: /datamodel/money@1
      summary: Returns the tax due for a cart, in the cart's own currency.
    - name: rates-loaded-at
      response: /datamodel/money@1
      summary: Diagnostic accessor — reports the vintage of the loaded rate table.
