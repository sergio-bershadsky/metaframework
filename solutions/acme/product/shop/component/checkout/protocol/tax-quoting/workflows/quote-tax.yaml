$schema: https://schemas.metaframework.dev/metaframework/product/specification/datamodel/workflow-document
name: quote-tax
title: Quote tax for a cart
summary: Checkout asks the embedded tax engine for the tax due on a cart before authorizing payment.
participants: [checkout, tax-engine]
steps:
  - message: quote-tax
    from: checkout
    to: tax-engine
    kind: call
    payload: /product/shop/component/checkout/datamodel/cart@1
    note: Jurisdiction comes from the cart's delivery address, never a separate argument.

  - message: tax-quoted
    from: tax-engine
    to: checkout
    kind: return
    payload: /datamodel/money@1
    condition: rate table is loaded
