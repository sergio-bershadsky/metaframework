name: request-refund
title: Request a refund on a settled order
summary: A support agent asks for a refund; the ledger checks the position and posts the reversing legs.
participants: [support-agent, ledger]
steps:
  - message: request-refund
    from: support-agent
    to: ledger
    kind: call
    note: Carries the agent's own identity, never a shared service credential.

  - alt:
      - when: the order still has a refundable balance
        steps:
          - message: refund-accepted
            from: ledger
            to: support-agent
            kind: return
            payload: /billing/datamodel/ledger-entry@1
      - when: the order was already fully refunded
        steps:
          - message: refund-rejected
            from: ledger
            to: support-agent
            kind: error
            payload: /datamodel/problem@1
